name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on origin/main. Merge the release commit to main and tag it there."
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify package version matches tag
        run: |
          node --input-type=commonjs <<'JS'
          const { version } = require("./package.json");
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            console.error(`The release tag does not match package.json. Tag the merged release commit as v${version}.`);
            process.exitCode = 1;
          }
          JS
      - run: npm install -g npm@11.20.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm publish --access public
